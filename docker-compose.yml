services:
  db:
    image: postgres:16-alpine
    container_name: skillbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillbridge
      POSTGRES_PASSWORD: skillbridge_dev_only
      POSTGRES_DB: skillbridge
    ports:
      - "5432:5432"
    volumes:
      - skillbridge_pgdata:/var/lib/postgresql/data
volumes:
  skillbridge_pgdata:
